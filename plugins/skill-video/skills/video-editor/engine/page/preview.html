<!doctype html>
<meta charset="utf-8" />
<title>preview</title>
<!--
  Live debug page (video.mjs preview): the scene itself, scaled to the window, played in real time.
  Space play/pause · ← → 1 s · , . one frame · M sound · R reload the scene (same time)
-->
<style>
  :root { color-scheme: dark; font: 14px/1.45 Inter, system-ui, sans-serif; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 1fr minmax(320px, 34%); background: #09090b; color: #e4e4e7; overflow: hidden; }
  main { display: flex; flex-direction: column; gap: 12px; padding: 16px; min-width: 0; }
  #view { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  #host { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px #27272a; }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button, select { background: #18181b; color: inherit; border: 1px solid #3f3f46; border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button.on { background: #2563eb33; border-color: #3b82f6; color: #93c5fd; }
  input[type=range] { flex: 1; accent-color: #3b82f6; }
  .muted { color: #a1a1aa; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  aside { border-left: 1px solid #27272a; padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #a1a1aa; margin: 8px 0 0; }
  .item { background: #18181b; border: 1px solid #27272a; border-radius: 10px; padding: 8px 10px; font-size: 12.5px; }
  .item pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; font-size: 11.5px; color: #a1a1aa; }
  kbd { border: 1px solid #3f3f46; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 12px; }
  #error { color: #fca5a5; white-space: pre-wrap; }
</style>
<main>
  <div class="bar">
    <button id="play">Play</button>
    <button id="sound">Sound</button>
    <select id="format"></select>
    <span class="muted"><span id="fps" class="mono">0</span> frames/s drawn</span>
  </div>
  <div id="view"><div id="host"></div></div>
  <div class="bar">
    <input id="seek" type="range" min="0" step="0.001" value="0" />
    <span class="mono" id="clock"></span>
  </div>
  <div class="muted">
    <kbd>Space</kbd> play · <kbd>←</kbd> <kbd>→</kbd> 1 s · <kbd>,</kbd> <kbd>.</kbd> one frame · <kbd>M</kbd> sound · <kbd>R</kbd> reload the scene
  </div>
</main>
<aside>
  <div id="error"></div>
  <div id="times" class="mono"></div>
  <div id="word"></div>
  <h2>Tweens live at this instant</h2>
  <div id="tweens"></div>
  <h2>Sound cues around</h2>
  <div id="cues" class="mono muted"></div>
  <div id="actors-box" hidden><h2>Actors live (actors/)</h2><div id="actors"></div></div>
</aside>
<script type="module">
  import { boot } from './engine/lib/page.js'

  const $ = id => document.getElementById(id), q = new URLSearchParams(location.search), format = q.get('format')
  let s, v = +(q.get('t') || 0), playing = false, busy = false, last = 0, drawn = 0, dirty = true, infoAt = 0
  addEventListener('error', e => ($('error').textContent = e.message))
  try {
    s = await boot($('host'), { format, type: '', variant: q.get('variant') })
  } catch (e) {
    $('error').textContent = e.stack ?? e.message
    throw e
  }
  const { job } = s, [W, H] = job.logical
  $('seek').max = job.duration
  for (const f of job.formats) $('format').append(new Option(f, f, f === format, f === format))
  $('actors-box').hidden = !job.actors

  const fit = () => {
    const k = Math.min($('view').clientWidth / W, $('view').clientHeight / H)
    $('host').style.transform = `scale(${k}) translate(-50%, -50%)`
  }
  fit()
  addEventListener('resize', fit)

  const audio = new Audio()
  for (const name of ['mix', 'voice']) if ((await fetch(`project/assets/${name}.wav`, { method: 'HEAD' })).ok) { audio.src = `project/assets/${name}.wav`; break }
  audio.muted = true

  const fmt = t => `${t.toFixed(2)} s`, describe = t => (t.id ? `#${t.id}` : t.classList?.length ? `.${[...t.classList].join('.')}` : t.tagName?.toLowerCase() ?? 'object')
  function info() {
    $('clock').textContent = `${fmt(v)} / ${fmt(job.duration)}`
    $('seek').value = v
    $('times').textContent = `${fmt(v)} video · ${fmt(s.api.source(v))} source`
    const w = s.api.words.find(x => x.v0 <= v && v < x.v1)
    $('word').textContent = w ? `Word « ${w.w} » (source ${w.t0.toFixed(2)})` : ''
    const at = c => c.startTime() + (c.parent && c.parent !== s.tl ? at(c.parent) : 0)
    const live = s.tl.getChildren(true, true, false).filter(c => at(c) <= v && v <= at(c) + c.totalDuration()).slice(0, 40)
    $('tweens').replaceChildren(...live.map(c => {
      const d = document.createElement('div'), pre = document.createElement('pre')
      d.className = 'item'
      d.textContent = `${c.targets().slice(0, 3).map(describe).join(', ')}${c.targets().length > 3 ? '…' : ''} · ${fmt(at(c))} → ${fmt(at(c) + c.totalDuration())}`
      pre.textContent = JSON.stringify(Object.fromEntries(Object.entries(c.vars).filter(([k, x]) => !['duration', 'ease', 'stagger', 'immediateRender'].includes(k) && typeof x !== 'function' && typeof x !== 'object')))
      d.append(pre)
      return d
    }))
    $('cues').textContent = s.cues().filter(c => Math.abs(c.t - v) < 1.5).map(c => `${fmt(c.t)} ${c.kind}`).join('\n')
    if (job.actors) $('actors').replaceChildren(...s.actors(v).map(a => Object.assign(document.createElement('pre'), { className: 'item', textContent: JSON.stringify(a) })))
  }

  function seek(t) {
    v = Math.min(Math.max(t, 0), job.duration - 1e-3)
    if (!audio.muted) audio.currentTime = v
    dirty = true
  }
  function toggle() {
    playing = !playing
    $('play').textContent = playing ? 'Pause' : 'Play'
    if (playing && v >= job.duration - 0.05) seek(0)
    if (playing && !audio.muted) { audio.currentTime = v; audio.play() } else audio.pause()
  }
  function sound() {
    audio.muted = !audio.muted
    $('sound').classList.toggle('on', !audio.muted)
    if (!audio.muted && playing) { audio.currentTime = v; audio.play() }
  }

  // the playhead follows the audio when the sound is on, the wall clock otherwise; a late frame is dropped
  async function tick(now) {
    requestAnimationFrame(tick)
    const dt = last ? (now - last) / 1000 : 0
    last = now
    if (playing) {
      v = !audio.muted && !audio.paused ? audio.currentTime : v + dt
      if (v >= job.duration) { v = job.duration - 1e-3; toggle() }
      dirty = true
    }
    if (!dirty || busy) return
    busy = true
    dirty = false
    await s.seek(v).catch(e => ($('error').textContent = e.message))
    drawn++
    busy = false
    if (now - infoAt > 120 || !playing) { info(); infoAt = now }
  }
  requestAnimationFrame(tick)
  setInterval(() => { $('fps').textContent = drawn; drawn = 0 }, 1000)

  const go = (f, t) => location.replace(`?format=${encodeURIComponent(f)}&t=${t.toFixed(3)}`)
  $('play').onclick = toggle
  $('sound').onclick = sound
  $('seek').oninput = e => seek(+e.target.value)
  $('format').onchange = e => go(e.target.value, v)
  addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT') return
    const frame = 1 / job.fps
    if (e.key === ' ') toggle()
    else if (e.key === 'ArrowLeft') seek(v - 1)
    else if (e.key === 'ArrowRight') seek(v + 1)
    else if (e.key === ',') seek(v - frame)
    else if (e.key === '.') seek(v + frame)
    else if (e.key === 'm' || e.key === 'M') sound()
    else if (e.key === 'r' || e.key === 'R') go(format, v)
    else return
    e.preventDefault()
  })
</script>
